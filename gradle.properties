# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -XX:+UseStringDeduplication

# Enable JS target for testing
enableJs=true

# Android
android.useAndroidX=true
android.enableJetifier=true

# Fix Kotlin/Native prebuilt dependency resolution issue
org.gradle.internal.repository.allow_unsafe=true